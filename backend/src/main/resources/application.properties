spring.application.name=daily-task-manager
server.port=${PORT:8080}

# If DB_URL is set (Render/Aiven), use MySQL. Otherwise use H2 for local development.
spring.datasource.url=${DB_URL:jdbc:h2:mem:dailytasks;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
